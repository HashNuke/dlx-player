# Memory-constrained host (7.6 GB, no swap): keep every build JVM small.
# Raise only if a build reports a Java-level OutOfMemoryError.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
