build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    active: false
  TooManyFunctions:
    # JellyfinSession is the API facade: one suspend fun per server route,
    # and the milestone roadmap keeps adding routes to it.
    thresholdInClasses: 20
exceptions:
  TooGenericExceptionCaught:
    active: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
